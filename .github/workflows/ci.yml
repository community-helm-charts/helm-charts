name: CI

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ci.yml"
      - "commitlint.config.js"
      - "charts/**"
      - "nx.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "project.json"
      - "packages/**"
      - "tests/**"
      - "tsconfig.json"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      publish_existing:
        description: Publish the current chart versions even when no release commit is generated.
        required: false
        default: false
        type: boolean

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print versions
        run: |
          git --version
          node --version
          pnpm --version
          pnpm exec commitlint --version

      - name: Validate current commit with commitlint
        if: github.event_name != 'pull_request'
        run: pnpm exec commitlint --last --verbose

      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "$COMMITLINT_FROM" --to "$COMMITLINT_TO" --verbose
        env:
          COMMITLINT_FROM: ${{ github.event.pull_request.base.sha }}
          COMMITLINT_TO: ${{ github.event.pull_request.head.sha }}

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: commitlint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Build nx-helm plugin
        run: pnpm --filter @community-helm-charts/nx-helm build

      - name: Run tests
        run: pnpm exec nx run-many -t test --projects=workspace,@community-helm-charts/nx-helm --output-style=stream

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Log in to the Container registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Release Helm charts
        env:
          PUBLISH_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_existing == true }}
        run: |
          before_release="$(git rev-parse HEAD)"
          pnpm exec nx release --skip-publish
          after_release="$(git rev-parse HEAD)"

          if [ "$after_release" = "$before_release" ]; then
            if [ "$PUBLISH_EXISTING" = "true" ]; then
              echo "No release changes detected; publishing current chart versions."
            else
              echo "No release changes detected; skipping publish."
              exit 0
            fi
          else
            git push --follow-tags --atomic origin main
          fi

          pnpm exec nx release publish --yes
