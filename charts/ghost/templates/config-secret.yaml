apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ghost.config.secretName" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if or .Values.secretAnnotations .Values.commonAnnotations }}
  annotations:
    {{- if .Values.secretAnnotations }}
    {{- include "common.tplvalues.render" (dict "value" .Values.secretAnnotations "context" $) | nindent 4 }}
    {{- end }}
    {{- if .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
type: Opaque
stringData:
  {{- include "ghost.config.flatten" (dict "prefix" "" "value" .Values.ghost.config "context" $) | nindent 2 }}
  {{- $config := default dict .Values.ghost.config }}
  {{- if not (dig "database" "connection" "host" "" $config) }}
  database__connection__host: {{ include "ghost.databaseHost" . | quote }}
  {{- end }}
  {{- if and (not .Values.mysql.enabled) (not (include "ghost.config.databasePassword" .)) }}
  database__connection__password: {{ required "ghost.config.database.connection.password is required when mysql.enabled=false" (include "ghost.config.databasePassword" .) | quote }}
  {{- end }}
  {{- if and .Values.trafficAnalytics.enabled (not (dig "tinybird" "tracker" "endpoint" "" $config)) }}
  tinybird__tracker__endpoint: {{ printf "%s/.ghost/analytics/api/v1/page_hit" (include "ghost.publicUrl" .) | quote }}
  {{- end }}
  {{- if and .Values.trafficAnalytics.enabled (not (dig "tinybird" "tracker" "datasource" "" $config)) }}
  tinybird__tracker__datasource: "analytics_events"
  {{- end }}
  {{- if and .Values.trafficAnalytics.enabled (not (dig "tinybird" "stats" "endpoint" "" $config)) }}
  tinybird__stats__endpoint: {{ .Values.trafficAnalytics.tinybird.apiUrl | quote }}
  {{- end }}
