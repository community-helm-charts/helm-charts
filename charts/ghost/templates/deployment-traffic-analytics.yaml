{{- if .Values.trafficAnalytics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ghost.trafficAnalytics.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  {{- $labels := include "common.tplvalues.merge" (dict "values" (list .Values.commonLabels) "context" .) }}
  labels: {{- include "common.labels.standard" (dict "customLabels" $labels "context" $) | nindent 4 }}
    app.kubernetes.io/component: traffic-analytics
spec:
  replicas: 1
  selector:
    {{- $podLabels := include "common.tplvalues.merge" (dict "values" (list .Values.trafficAnalytics.podLabels .Values.commonLabels) "context" .) }}
    matchLabels: {{- include "common.labels.matchLabels" (dict "customLabels" $podLabels "context" $) | nindent 6 }}
      app.kubernetes.io/component: traffic-analytics
  template:
    metadata:
      labels: {{- include "common.labels.standard" (dict "customLabels" $podLabels "context" $) | nindent 8 }}
        app.kubernetes.io/component: traffic-analytics
      {{- if or (include "ghost.trafficAnalytics.createSecret" .) .Values.trafficAnalytics.podAnnotations }}
      annotations:
        {{- if (include "ghost.trafficAnalytics.createSecret" .) }}
        checksum/traffic-analytics-secret: {{ include "common.utils.checksumTemplate" (dict "path" "/traffic-analytics-secret.yaml" "context" $) }}
        {{- end }}
        {{- if .Values.trafficAnalytics.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" .Values.trafficAnalytics.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ghost.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- include "ghost.trafficAnalytics.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.trafficAnalytics.affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .Values.trafficAnalytics.affinity "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.trafficAnalytics.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" (dict "value" .Values.trafficAnalytics.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.trafficAnalytics.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.trafficAnalytics.tolerations "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.trafficAnalytics.topologySpreadConstraints }}
      topologySpreadConstraints: {{- include "common.tplvalues.render" (dict "value" .Values.trafficAnalytics.topologySpreadConstraints "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.trafficAnalytics.podSecurityContext.enabled }}
      securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.trafficAnalytics.podSecurityContext "context" $) | nindent 8 }}
      {{- end }}
      containers:
        - name: traffic-analytics
          image: {{ include "ghost.trafficAnalytics.image" . }}
          imagePullPolicy: {{ .Values.trafficAnalytics.image.pullPolicy | quote }}
          {{- if .Values.trafficAnalytics.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.trafficAnalytics.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          env:
            - name: NODE_ENV
              value: production
            - name: PROXY_TARGET
              value: {{ printf "%s/v0/events" (.Values.trafficAnalytics.tinybird.apiUrl | trimSuffix "/") | quote }}
            - name: SALT_STORE_TYPE
              value: {{ .Values.trafficAnalytics.saltStoreType | quote }}
            - name: SALT_STORE_FILE_PATH
              value: {{ printf "%s/salts.json" .Values.trafficAnalytics.persistence.mountPath | quote }}
            - name: TINYBIRD_TRACKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ghost.trafficAnalytics.secretName" . }}
                  key: {{ include "ghost.trafficAnalytics.trackerTokenKey" . }}
            - name: LOG_LEVEL
              value: {{ .Values.trafficAnalytics.logLevel | quote }}
            {{- if .Values.trafficAnalytics.extraEnvVars }}
            {{- include "common.tplvalues.render" (dict "value" .Values.trafficAnalytics.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.trafficAnalytics.containerPorts.http }}
          {{- if .Values.trafficAnalytics.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.trafficAnalytics.customLivenessProbe "context" $) | nindent 12 }}
          {{- else if .Values.trafficAnalytics.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: http
            {{- include "common.tplvalues.render" (dict "value" (omit .Values.trafficAnalytics.livenessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.trafficAnalytics.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.trafficAnalytics.customReadinessProbe "context" $) | nindent 12 }}
          {{- else if .Values.trafficAnalytics.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: http
            {{- include "common.tplvalues.render" (dict "value" (omit .Values.trafficAnalytics.readinessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.trafficAnalytics.resources }}
          resources: {{- toYaml .Values.trafficAnalytics.resources | nindent 12 }}
          {{- else if ne .Values.trafficAnalytics.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.trafficAnalytics.resourcesPreset) | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: {{ .Values.trafficAnalytics.persistence.volumeName }}
              mountPath: {{ .Values.trafficAnalytics.persistence.mountPath }}
            {{- if .Values.trafficAnalytics.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.trafficAnalytics.extraVolumeMounts "context" $) | nindent 12 }}
            {{- end }}
      volumes:
        - name: {{ .Values.trafficAnalytics.persistence.volumeName }}
          {{- if .Values.trafficAnalytics.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "ghost.trafficAnalytics.fullname" .) .Values.trafficAnalytics.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.trafficAnalytics.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.trafficAnalytics.extraVolumes "context" $) | nindent 8 }}
        {{- end }}
{{- end }}
