{{- if and .Values.ingress.enabled .Values.trafficAnalytics.enabled }}
{{- if (include "ghost.trafficAnalytics.renderTraefikMiddleware" .) }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "ghost.trafficAnalyticsStripPrefixMiddlewareName" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  stripPrefix:
    prefixes:
      - /.ghost/analytics
---
{{- end }}
apiVersion: {{ default (include "common.capabilities.ingress.apiVersion" .) .Values.ingress.apiVersion }}
kind: Ingress
metadata:
  name: {{ include "ghost.trafficAnalyticsIngress.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if or (include "ghost.trafficAnalytics.useTraefikAnnotations" .) (include "ghost.trafficAnalytics.useNginxAnnotations" .) .Values.ingress.annotations .Values.commonAnnotations }}
  annotations:
    {{- if (include "ghost.trafficAnalytics.useTraefikAnnotations" .) }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ include "ghost.trafficAnalyticsStripPrefixMiddlewareRef" . | quote }}
    {{- end }}
    {{- if (include "ghost.trafficAnalytics.useNginxAnnotations" .) }}
    nginx.ingress.kubernetes.io/rewrite-target: /api/v1/page_hit
    {{- end }}
    {{- if or .Values.ingress.annotations .Values.commonAnnotations }}
    {{- $annotations := include "common.tplvalues.merge" (dict "values" (list .Values.ingress.annotations .Values.commonAnnotations) "context" .) }}
    {{- include "common.tplvalues.render" (dict "value" $annotations "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName | quote }}
  {{- end }}
  rules:
    - host: {{ tpl .Values.ingress.hostname $ | quote }}
      http:
        paths:
          - path: {{ include "ghost.trafficAnalytics.path" . | quote }}
            pathType: {{ include "ghost.trafficAnalytics.pathType" . }}
            backend: {{- include "common.ingress.backend" (dict "serviceName" (include "ghost.trafficAnalytics.fullname" .) "servicePort" "http" "context" $) | nindent 14 }}
  {{- if or .Values.ingress.tls .Values.ingress.extraTls }}
  tls:
    {{- if .Values.ingress.tls }}
    - hosts:
        - {{ tpl .Values.ingress.hostname $ | quote }}
      secretName: {{ printf "%s-tls" ((tpl .Values.ingress.hostname $) | replace "*." "") | trunc 63 | trimSuffix "-" }}
    {{- end }}
    {{- if .Values.ingress.extraTls }}
    {{- include "common.tplvalues.render" (dict "value" .Values.ingress.extraTls "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
