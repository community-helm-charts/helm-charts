{{- if and .Values.trafficAnalytics.enabled .Values.trafficAnalytics.tinybird.deploy.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-tinybird-deploy" (include "ghost.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: tinybird-deploy
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- if .Values.trafficAnalytics.tinybird.deploy.annotations }}
    {{- include "common.tplvalues.render" (dict "value" .Values.trafficAnalytics.tinybird.deploy.annotations "context" $) | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.trafficAnalytics.tinybird.deploy.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.trafficAnalytics.tinybird.deploy.activeDeadlineSeconds }}
  template:
    metadata:
      labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 8 }}
        app.kubernetes.io/component: tinybird-deploy
      {{- if or (include "ghost.trafficAnalytics.createSecret" .) .Values.trafficAnalytics.tinybird.deploy.podAnnotations }}
      annotations:
        {{- if (include "ghost.trafficAnalytics.createSecret" .) }}
        checksum/traffic-analytics-secret: {{ include "common.utils.checksumTemplate" (dict "path" "/traffic-analytics-secret.yaml" "context" $) }}
        {{- end }}
        {{- if .Values.trafficAnalytics.tinybird.deploy.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" .Values.trafficAnalytics.tinybird.deploy.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "ghost.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- include "ghost.tinybirdDeploy.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: sync-tinybird-files
          image: {{ include "ghost.image" . }}
          imagePullPolicy: {{ .Values.ghost.image.pullPolicy | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              if [ -d /var/lib/ghost/current/core/server/data/tinybird ]; then
                rm -rf /data/tinybird/*;
                cp -rf /var/lib/ghost/current/core/server/data/tinybird/* /data/tinybird/;
                echo 'Tinybird files synced into shared volume.';
              else
                echo 'Tinybird source directory not found.';
                exit 1;
              fi
          volumeMounts:
            - name: tinybird-files
              mountPath: /data/tinybird
      containers:
        - name: tinybird-deploy
          image: {{ include "ghost.tinybirdDeploy.image" . }}
          imagePullPolicy: {{ .Values.trafficAnalytics.tinybird.deploy.image.pullPolicy | quote }}
          workingDir: /data/tinybird
          env:
            - name: TINYBIRD_API_URL
              value: {{ .Values.trafficAnalytics.tinybird.apiUrl | quote }}
            - name: TINYBIRD_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ghost.trafficAnalytics.secretName" . }}
                  key: {{ include "ghost.trafficAnalytics.adminTokenKey" . }}
          command:
            - /bin/sh
            - -ec
            - |
              tb --cloud --host "${TINYBIRD_API_URL}" --token "${TINYBIRD_ADMIN_TOKEN}" deploy --allow-destructive-operations
          {{- if .Values.trafficAnalytics.tinybird.deploy.resources }}
          resources: {{- toYaml .Values.trafficAnalytics.tinybird.deploy.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tinybird-files
              mountPath: /data/tinybird
      volumes:
        - name: tinybird-files
          emptyDir: {}
{{- end }}
