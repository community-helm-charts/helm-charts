{{- if .Values.ghost.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ghost.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  {{- $labels := include "common.tplvalues.merge" (dict "values" (list .Values.commonLabels) "context" .) }}
  labels: {{- include "common.labels.standard" (dict "customLabels" $labels "context" $) | nindent 4 }}
    app.kubernetes.io/component: ghost
spec:
  replicas: 1
  serviceName: {{ include "ghost.serviceName" . }}
  updateStrategy: {{- toYaml .Values.ghost.updateStrategy | nindent 4 }}
  selector:
    {{- $podLabels := include "common.tplvalues.merge" (dict "values" (list .Values.ghost.podLabels .Values.commonLabels) "context" .) }}
    matchLabels: {{- include "common.labels.matchLabels" (dict "customLabels" $podLabels "context" $) | nindent 6 }}
      app.kubernetes.io/component: ghost
  template:
    metadata:
      labels: {{- include "common.labels.standard" (dict "customLabels" $podLabels "context" $) | nindent 8 }}
        app.kubernetes.io/component: ghost
      annotations:
        checksum/config-secret: {{ include "common.utils.checksumTemplate" (dict "path" "/config-secret.yaml" "context" $) }}
        {{- if (include "ghost.trafficAnalytics.createSecret" .) }}
        checksum/traffic-analytics-secret: {{ include "common.utils.checksumTemplate" (dict "path" "/traffic-analytics-secret.yaml" "context" $) }}
        {{- end }}
        {{- if .Values.ghost.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" .Values.ghost.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ghost.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- include "ghost.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.ghost.hostAliases }}
      hostAliases: {{- include "common.tplvalues.render" (dict "value" .Values.ghost.hostAliases "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.ghost.affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .Values.ghost.affinity "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.ghost.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" (dict "value" .Values.ghost.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.ghost.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.ghost.tolerations "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.ghost.topologySpreadConstraints }}
      topologySpreadConstraints: {{- include "common.tplvalues.render" (dict "value" .Values.ghost.topologySpreadConstraints "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.ghost.priorityClassName }}
      priorityClassName: {{ .Values.ghost.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.ghost.schedulerName }}
      schedulerName: {{ .Values.ghost.schedulerName | quote }}
      {{- end }}
      {{- if .Values.ghost.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.ghost.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if .Values.ghost.podSecurityContext.enabled }}
      securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.ghost.podSecurityContext "context" $) | nindent 8 }}
      {{- end }}
      {{- if or .Values.databaseWait.enabled .Values.activitypub.enabled .Values.ghost.initContainers }}
      initContainers:
        {{- if .Values.databaseWait.enabled }}
        - name: wait-for-database
          image: {{ include "ghost.mysql.image" . }}
          imagePullPolicy: {{ include "ghost.mysql.imagePullPolicy" . | quote }}
          env:
            - name: DATABASE_HOST
              value: {{ include "ghost.databaseHost" . | quote }}
            - name: DATABASE_PORT
              value: {{ include "ghost.databasePort" . | quote }}
            - name: DATABASE_USER
              value: {{ include "ghost.databaseUser" . | quote }}
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.mysql.enabled }}
                  name: {{ include "ghost.databaseSecretName" . }}
                  {{- else }}
                  name: {{ include "ghost.config.secretName" . }}
                  {{- end }}
                  key: {{ include "ghost.databasePasswordKey" . }}
          command:
            - /bin/sh
            - -ec
            - |
              deadline=$((SECONDS + {{ .Values.databaseWait.timeoutSeconds }}))
              until mysqladmin ping -h "$DATABASE_HOST" -P "$DATABASE_PORT" -u "$DATABASE_USER" --silent; do
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "Timed out waiting for MySQL at ${DATABASE_HOST}:${DATABASE_PORT}" >&2
                  exit 1
                fi
                sleep 2
              done
        {{- end }}
        {{- if .Values.activitypub.enabled }}
        - name: wait-for-activitypub
          image: {{ include "ghost.activitypub.image" . }}
          imagePullPolicy: {{ .Values.activitypub.image.pullPolicy | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              deadline=$((SECONDS + {{ .Values.databaseWait.timeoutSeconds }}))
              url="http://{{ include "ghost.activitypub.fullname" . }}.{{ include "common.names.namespace" . }}.svc.{{ .Values.clusterDomain }}:{{ .Values.activitypub.service.ports.http }}/ping"
              until node -e 'fetch(process.argv[1]).then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))' "$url"; do
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "Timed out waiting for ActivityPub at ${url}" >&2
                  exit 1
                fi
                sleep 2
              done
        {{- end }}
        {{- if .Values.ghost.initContainers }}
        {{- include "common.tplvalues.render" (dict "value" .Values.ghost.initContainers "context" $) | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: ghost
          image: {{ include "ghost.image" . }}
          imagePullPolicy: {{ .Values.ghost.image.pullPolicy | quote }}
          {{- if .Values.ghost.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.ghost.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.ghost.command }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.ghost.command "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.ghost.args }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.ghost.args "context" $) | nindent 12 }}
          {{- end }}
          env:
            - name: NODE_ENV
              value: production
            {{- if and .Values.mysql.enabled (not (include "ghost.config.databasePassword" .)) }}
            - name: database__connection__password
              valueFrom:
                secretKeyRef:
                  name: {{ include "ghost.databaseSecretName" . }}
                  key: {{ include "ghost.databasePasswordKey" . }}
            {{- end }}
            {{- if and .Values.trafficAnalytics.enabled (not (include "ghost.config.tinybirdAdminToken" .)) }}
            - name: tinybird__adminToken
              valueFrom:
                secretKeyRef:
                  name: {{ include "ghost.trafficAnalytics.secretName" . }}
                  key: {{ include "ghost.trafficAnalytics.adminTokenKey" . }}
            {{- end }}
            {{- if and .Values.trafficAnalytics.enabled (not (include "ghost.config.tinybirdWorkspaceId" .)) }}
            - name: tinybird__workspaceId
              valueFrom:
                secretKeyRef:
                  name: {{ include "ghost.trafficAnalytics.secretName" . }}
                  key: {{ include "ghost.trafficAnalytics.workspaceIdKey" . }}
            {{- end }}
            {{- if .Values.ghost.extraEnvVars }}
            {{- include "common.tplvalues.render" (dict "value" .Values.ghost.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "ghost.config.secretName" . }}
            {{- if .Values.ghost.extraEnvVarsCM }}
            - configMapRef:
                name: {{ .Values.ghost.extraEnvVarsCM }}
            {{- end }}
            {{- if .Values.ghost.extraEnvVarsSecret }}
            - secretRef:
                name: {{ .Values.ghost.extraEnvVarsSecret }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ghost.containerPorts.http }}
          {{- if .Values.ghost.customStartupProbe }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" .Values.ghost.customStartupProbe "context" $) | nindent 12 }}
          {{- else if .Values.ghost.startupProbe.enabled }}
          startupProbe:
            tcpSocket:
              port: http
            {{- include "common.tplvalues.render" (dict "value" (omit .Values.ghost.startupProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.ghost.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.ghost.customLivenessProbe "context" $) | nindent 12 }}
          {{- else if .Values.ghost.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: http
            {{- include "common.tplvalues.render" (dict "value" (omit .Values.ghost.livenessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.ghost.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.ghost.customReadinessProbe "context" $) | nindent 12 }}
          {{- else if .Values.ghost.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: http
            {{- include "common.tplvalues.render" (dict "value" (omit .Values.ghost.readinessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.ghost.resources }}
          resources: {{- toYaml .Values.ghost.resources | nindent 12 }}
          {{- else if ne .Values.ghost.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.ghost.resourcesPreset) | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: ghost-content
              mountPath: /var/lib/ghost/content
              {{- if .Values.persistence.subPath }}
              subPath: {{ .Values.persistence.subPath }}
              {{- end }}
            {{- if .Values.ghost.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.ghost.extraVolumeMounts "context" $) | nindent 12 }}
            {{- end }}
        {{- if .Values.ghost.sidecars }}
        {{- include "common.tplvalues.render" (dict "value" .Values.ghost.sidecars "context" $) | nindent 8 }}
        {{- end }}
      volumes:
        - name: ghost-content
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ghost.contentPvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.ghost.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.ghost.extraVolumes "context" $) | nindent 8 }}
        {{- end }}
{{- end }}
