{{- if not .Values.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "new-api.config.secretName" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if or .Values.secretAnnotations .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" (dict "values" (list .Values.secretAnnotations .Values.commonAnnotations) "context" .) }}
  annotations: {{- include "common.tplvalues.render" (dict "value" $annotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ .Values.config.sessionSecretKey }}: {{ include "common.secrets.passwords.manage" (dict "secret" (include "new-api.config.secretName" .) "key" .Values.config.sessionSecretKey "providedValues" (list "config.sessionSecret") "length" 64 "honorProvidedValues" true "context" $) }}
  {{ .Values.config.cryptoSecretKey }}: {{ include "common.secrets.passwords.manage" (dict "secret" (include "new-api.config.secretName" .) "key" .Values.config.cryptoSecretKey "providedValues" (list "config.cryptoSecret") "length" 64 "honorProvidedValues" true "context" $) }}
{{- end }}
{{- range $name, $config := dict "postgresql" .Values.externalPostgresql "valkey" .Values.externalValkey }}
{{- $bundled := ternary $.Values.postgresql.enabled $.Values.valkey.enabled (eq $name "postgresql") }}
{{- if and (not $bundled) (not $config.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include (printf "new-api.%s.secretName" $name) $ }}
  namespace: {{ include "common.names.namespace" $ | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" $.Values.commonLabels "context" $) | nindent 4 }}
  {{- if or $.Values.secretAnnotations $.Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" (dict "values" (list $.Values.secretAnnotations $.Values.commonAnnotations) "context" $) }}
  annotations: {{- include "common.tplvalues.render" (dict "value" $annotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ include (printf "new-api.%s.secretKey" $name) $ }}: {{ $config.url | b64enc | quote }}
{{- end }}
{{- end }}
