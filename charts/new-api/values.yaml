## @section Global parameters
## @param global.imageRegistry Global container image registry
## @param global.imagePullSecrets Global container registry secret names
## @param global.defaultStorageClassName Global default StorageClass for Persistent Volumes
## @param global.storageClassName Global StorageClass override kept for compatibility
##
global:
  imageRegistry: ""
  imagePullSecrets: []
  defaultStorageClassName: ""
  storageClassName: ""

## @section Common parameters
## @param kubeVersion Override Kubernetes version
## @param nameOverride Partially override the chart name
## @param fullnameOverride Fully override the chart name
## @param namespaceOverride Fully override the release namespace
## @param clusterDomain Kubernetes cluster domain
## @param commonLabels Labels added to every resource
## @param commonAnnotations Annotations added to every resource
## @param extraDeploy Additional objects to deploy
##
kubeVersion: ""
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
clusterDomain: cluster.local
commonLabels: {}
commonAnnotations: {}
extraDeploy: []

## @section New API image parameters
## @param image.registry New API image registry
## @param image.repository New API image repository
## @param image.tag New API image tag
## @param image.digest New API image digest in the form sha256:...
## @param image.pullPolicy New API image pull policy
## @param image.pullSecrets New API image pull secrets
##
image:
  registry: docker.io
  repository: calciumion/new-api
  tag: "v1.0.0-rc.51"
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

## @param containerPorts.http New API HTTP container port
##
containerPorts:
  http: 3000

## @section New API Service parameters
## @param service.enabled Create the New API Service
## @param service.type Kubernetes Service type
## @param service.ports.http New API HTTP Service port
## @param service.nodePorts.http HTTP node port for NodePort or LoadBalancer
## @param service.clusterIP Service ClusterIP
## @param service.annotations Additional Service annotations
## @param service.labels Additional Service labels
## @param service.internalTrafficPolicy Service internal traffic policy
## @param service.externalTrafficPolicy Service external traffic policy
## @param service.loadBalancerClass Service load balancer class
## @param service.loadBalancerIP Service load balancer IP
## @param service.loadBalancerSourceRanges Allowed LoadBalancer source ranges
## @param service.sessionAffinity Service session affinity
## @param service.sessionAffinityConfig Additional session affinity settings
## @param service.ipFamilyPolicy Service IP family policy
## @param service.ipFamilies Service IP families
## @param service.extraPorts Additional Service ports
##
service:
  enabled: true
  type: ClusterIP
  ports:
    http: 80
  nodePorts:
    http: ""
  clusterIP: ""
  annotations: {}
  labels: {}
  internalTrafficPolicy: Cluster
  externalTrafficPolicy: Cluster
  loadBalancerClass: ""
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  sessionAffinity: None
  sessionAffinityConfig: {}
  ipFamilyPolicy: ""
  ipFamilies: []
  extraPorts: []

## @section New API Ingress parameters
## @param ingress.enabled Create an Ingress for the New API
## @param ingress.pathType Ingress path type
## @param ingress.apiVersion Force the Ingress API version
## @param ingress.hostname Default Ingress hostname
## @param ingress.path Default Ingress path
## @param ingress.annotations Additional Ingress annotations
## @param ingress.ingressClassName IngressClass used for the Ingress
## @param ingress.tls Enable TLS for the default hostname
## @param ingress.extraHosts Additional hostnames
## @param ingress.extraPaths Additional paths under the default host
## @param ingress.extraTls Additional TLS entries
## @param ingress.extraRules Additional Ingress rules
## @param ingress.secrets TLS Secrets to create
##
ingress:
  enabled: false
  pathType: Prefix
  apiVersion: ""
  hostname: new-api.example.com
  path: /
  annotations: {}
  ingressClassName: ""
  tls: false
  extraHosts: []
  extraPaths: []
  extraTls: []
  extraRules: []
  secrets: []

## @section New API external services
## @param secretAnnotations Annotations for chart-managed application Secrets
## @param externalPostgresql.url External PostgreSQL URL (requires postgresql.enabled=false)
## @param externalPostgresql.existingSecret Existing Secret containing the external SQL_DSN
## @param externalPostgresql.secretKey Secret key containing SQL_DSN
## @param externalValkey.url External redis:// or rediss:// URL (requires valkey.enabled=false)
## @param externalValkey.existingSecret Existing Secret containing REDIS_CONN_STRING
## @param externalValkey.secretKey Secret key containing REDIS_CONN_STRING
##
secretAnnotations: {}
externalPostgresql:
  url: ""
  existingSecret: ""
  secretKey: sql-dsn
externalValkey:
  url: ""
  existingSecret: ""
  secretKey: valkey-url

## @section PostgreSQL subchart parameters
## @param postgresql.enabled Deploy the bundled PostgreSQL server
## @param postgresql.auth.username PostgreSQL user created on first startup
## @param postgresql.auth.password PostgreSQL password; generated when empty
## @param postgresql.auth.database PostgreSQL database created on first startup
## @param postgresql.auth.existingSecret Existing Secret containing the raw PostgreSQL password
## @param postgresql.auth.existingSecretPasswordKey Key in the existing PostgreSQL Secret
## @param postgresql.persistence.enabled Persist PostgreSQL data
## @param postgresql.persistence.size PostgreSQL data volume size
##
postgresql:
  enabled: true
  auth:
    username: newapi
    password: ""
    database: newapi
    existingSecret: ""
    existingSecretPasswordKey: postgresql-password
  persistence:
    enabled: true
    size: 8Gi

## @section Valkey subchart parameters
## @param valkey.enabled Deploy the bundled Valkey server
## @param valkey.auth.enabled Enable Valkey password authentication
## @param valkey.auth.password Valkey password; generated when empty
## @param valkey.auth.existingSecret Existing Secret containing the raw Valkey password
## @param valkey.auth.existingSecretPasswordKey Key in the existing Valkey Secret
## @param valkey.persistence.enabled Persist Valkey data
## @param valkey.persistence.size Valkey data volume size
##
valkey:
  enabled: true
  auth:
    enabled: true
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: valkey-password
  persistence:
    enabled: true
    size: 8Gi

## @section New API application configuration
## @param config.syncFrequency Database/cache synchronization frequency in seconds for all nodes (SYNC_FREQUENCY)
## @param config.batchUpdateEnabled Enable batched database updates on all nodes (BATCH_UPDATE_ENABLED)
## @param config.batchUpdateInterval Batched database update interval in seconds (BATCH_UPDATE_INTERVAL)
## @param config.errorLogEnabled Enable database-backed error logging (ERROR_LOG_ENABLED)
## @param config.memoryCacheEnabled Enable the in-process application cache (MEMORY_CACHE_ENABLED)
## @param config.timezone Application timezone (TZ)
## @param config.sessionSecret Session signing secret; generated when empty and reused on upgrades
## @param config.cryptoSecret Encryption secret; generated when empty and reused on upgrades
## @param config.existingSecret Existing Secret containing both application secrets
## @param config.sessionSecretKey Key containing SESSION_SECRET
## @param config.cryptoSecretKey Key containing CRYPTO_SECRET
##
config:
  syncFrequency: 60
  batchUpdateEnabled: true
  batchUpdateInterval: 5
  errorLogEnabled: false
  memoryCacheEnabled: false
  timezone: UTC
  sessionSecret: ""
  cryptoSecret: ""
  existingSecret: ""
  sessionSecretKey: session-secret
  cryptoSecretKey: crypto-secret

## @section New API workload parameters
## @param podManagementPolicy StatefulSet pod management policy (OrderedReady or Parallel)
## @param updateStrategy StatefulSet update strategy for the master and the default for slaves
## @param command Override the application command after connection URL generation
## @param args Application arguments; retain --log-dir= to disable file logging (port is set separately)
## @param extraEnvVars Additional server environment variables
## @param extraEnvVarsCM Existing ConfigMap imported as environment variables
## @param extraEnvVarsSecret Existing Secret imported as environment variables
## @param extraVolumes Additional pod volumes (the chart always provides a temporary /tmp volume)
## @param extraVolumeMounts Additional server volume mounts
## @param initContainers Additional init containers
## @param sidecars Additional sidecar containers
##
podManagementPolicy: OrderedReady
updateStrategy:
  type: RollingUpdate
command: []
args:
  - --log-dir=
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []

## @section New API slave parameters
## @param slave.enabled Deploy slave nodes in addition to the single master
## @param slave.replicaCount Number of slave replicas when enabled
## @param slave.frontendBaseUrl Optional frontend URL used only by slaves
## @param slave.extraEnvVars Additional slave-only environment variables
## @param slave.resources Slave resource requests and limits; inherits resources when empty
## @param slave.updateStrategy Slave StatefulSet update strategy overrides
##
slave:
  enabled: false
  replicaCount: 1
  frontendBaseUrl: ""
  extraEnvVars: []
  resources: {}
  updateStrategy: {}

## @section New API pod parameters
## @param podLabels Additional pod labels
## @param podAnnotations Additional pod annotations
## @param podSecurityContext.enabled Enable the pod security context
## @param podSecurityContext.fsGroupChangePolicy Pod filesystem group change policy
## @param podSecurityContext.sysctls Pod sysctls
## @param podSecurityContext.supplementalGroups Pod supplemental groups
## @param podSecurityContext.fsGroup Pod filesystem group
## @param containerSecurityContext.enabled Enable the container security context
## @param containerSecurityContext.runAsUser Container user ID
## @param containerSecurityContext.runAsGroup Container group ID
## @param containerSecurityContext.runAsNonRoot Require a non-root container
## @param containerSecurityContext.readOnlyRootFilesystem Use a read-only application root filesystem
## @param containerSecurityContext.allowPrivilegeEscalation Allow privilege escalation
## @param containerSecurityContext.capabilities.drop Linux capabilities to drop
## @param containerSecurityContext.seccompProfile.type Seccomp profile type
##
podLabels: {}
podAnnotations: {}
podSecurityContext:
  enabled: true
  fsGroupChangePolicy: Always
  sysctls: []
  supplementalGroups: []
  fsGroup: 1001
containerSecurityContext:
  enabled: true
  runAsUser: 1001
  runAsGroup: 1001
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

## @section New API resource parameters
## @param resourcesPreset Common resource preset
## @param resources Explicit resource requests and limits
##
resourcesPreset: none
resources: {}

## @section New API probe parameters
## @param startupProbe.enabled Enable the startup probe
## @param startupProbe.httpGet.path Startup probe HTTP path
## @param startupProbe.httpGet.port Startup probe port name
## @param livenessProbe.enabled Enable the liveness probe
## @param livenessProbe.httpGet.path Liveness probe HTTP path
## @param livenessProbe.httpGet.port Liveness probe port name
## @param readinessProbe.enabled Enable the readiness probe
## @param readinessProbe.httpGet.path Readiness probe HTTP path
## @param readinessProbe.httpGet.port Readiness probe port name
## @param customStartupProbe Complete startup probe override
## @param customLivenessProbe Complete liveness probe override
## @param customReadinessProbe Complete readiness probe override
##
startupProbe:
  enabled: true
  httpGet:
    path: /api/status
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60
  successThreshold: 1
livenessProbe:
  enabled: true
  httpGet:
    path: /api/status
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1
readinessProbe:
  enabled: true
  httpGet:
    path: /api/status
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1
customStartupProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}

## @section New API scheduling parameters
## @param priorityClassName Pod priority class
## @param schedulerName Alternate scheduler
## @param terminationGracePeriodSeconds Pod termination grace period
## @param hostAliases Pod host aliases
## @param affinity Pod affinity rules
## @param nodeSelector Node selection labels
## @param tolerations Pod tolerations
## @param topologySpreadConstraints Pod topology spread constraints
##
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: ""
hostAliases: []
affinity: {}
nodeSelector: {}
tolerations: []
topologySpreadConstraints: []

## @section New API ServiceAccount parameters
## @param serviceAccount.create Create the server ServiceAccount
## @param serviceAccount.name Server ServiceAccount name
## @param serviceAccount.automountServiceAccountToken Automount API credentials on the ServiceAccount
## @param serviceAccount.annotations Additional ServiceAccount annotations
## @param automountServiceAccountToken Automount API credentials in server pods
##
serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false
  annotations: {}
automountServiceAccountToken: false
