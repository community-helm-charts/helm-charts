## @section Global parameters
## @param global.imageRegistry Global container image registry
## @param global.imagePullSecrets Global container registry secret names
## @param global.defaultStorageClassName Global default StorageClass for Persistent Volumes
## @param global.storageClassName Global StorageClass override kept for compatibility
##
global:
  imageRegistry: ""
  imagePullSecrets: []
  defaultStorageClassName: ""
  storageClassName: ""

## @section Common parameters
## @param kubeVersion Override Kubernetes version
## @param nameOverride Partially override the chart name
## @param fullnameOverride Fully override the chart name
## @param namespaceOverride Fully override the release namespace
## @param clusterDomain Kubernetes cluster domain
## @param commonLabels Labels added to every resource
## @param commonAnnotations Annotations added to every resource
## @param extraDeploy Additional objects to deploy
##
kubeVersion: ""
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
clusterDomain: cluster.local
commonLabels: {}
commonAnnotations: {}
extraDeploy: []

## @section Uptime Kuma image parameters
## @param image.registry Uptime Kuma image registry
## @param image.repository Uptime Kuma image repository
## @param image.tag Uptime Kuma image tag
## @param image.digest Uptime Kuma image digest in the form sha256:...
## @param image.pullPolicy Uptime Kuma image pull policy
## @param image.pullSecrets Uptime Kuma image pull secrets
##
image:
  registry: docker.io
  repository: louislam/uptime-kuma
  tag: "2.5.4"
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

## @param containerPorts.http Uptime Kuma HTTP container port
##
containerPorts:
  http: 3001

## @section Uptime Kuma Service parameters
## @param service.enabled Create the Uptime Kuma Service
## @param service.type Kubernetes Service type
## @param service.ports.http Uptime Kuma HTTP Service port
## @param service.nodePorts.http HTTP node port for NodePort or LoadBalancer
## @param service.clusterIP Service ClusterIP
## @param service.annotations Additional Service annotations
## @param service.labels Additional Service labels
## @param service.internalTrafficPolicy Service internal traffic policy
## @param service.externalTrafficPolicy Service external traffic policy
## @param service.loadBalancerClass Service load balancer class
## @param service.loadBalancerIP Service load balancer IP
## @param service.loadBalancerSourceRanges Allowed LoadBalancer source ranges
## @param service.sessionAffinity Service session affinity
## @param service.sessionAffinityConfig Additional session affinity settings
## @param service.ipFamilyPolicy Service IP family policy
## @param service.ipFamilies Service IP families
## @param service.extraPorts Additional Service ports
##
service:
  enabled: true
  type: ClusterIP
  ports:
    http: 3001
  nodePorts:
    http: ""
  clusterIP: ""
  annotations: {}
  labels: {}
  internalTrafficPolicy: Cluster
  externalTrafficPolicy: Cluster
  loadBalancerClass: ""
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  sessionAffinity: None
  sessionAffinityConfig: {}
  ipFamilyPolicy: ""
  ipFamilies: []
  extraPorts: []

## @section Uptime Kuma Ingress parameters
## @param ingress.enabled Create an Ingress for the Uptime Kuma
## @param ingress.pathType Ingress path type
## @param ingress.apiVersion Force the Ingress API version
## @param ingress.hostname Default Ingress hostname
## @param ingress.path Default Ingress path
## @param ingress.annotations Additional Ingress annotations
## @param ingress.ingressClassName IngressClass used for the Ingress
## @param ingress.tls Enable TLS for the default hostname
## @param ingress.extraHosts Additional hostnames
## @param ingress.extraPaths Additional paths under the default host
## @param ingress.extraTls Additional TLS entries
## @param ingress.extraRules Additional Ingress rules
## @param ingress.secrets TLS Secrets to create
##
ingress:
  enabled: false
  pathType: Prefix
  apiVersion: ""
  hostname: status.example.com
  path: /
  annotations: {}
  ingressClassName: ""
  tls: false
  extraHosts: []
  extraPaths: []
  extraTls: []
  extraRules: []
  secrets: []

## @section Uptime Kuma persistence parameters
## @param persistence.enabled Persist Uptime Kuma local data; disabling this loses local files when the pod is removed
## @param persistence.volumeName Application data volume name
## @param persistence.mountPath Application data mount path
## @param persistence.subPath Subdirectory of the volume to mount
## @param persistence.storageClassName StorageClass for the server PVC
## @param persistence.accessModes Persistent Volume access modes
## @param persistence.size Persistent Volume size
## @param persistence.annotations Additional PVC annotations
## @param persistence.labels Additional PVC labels
## @param persistence.selector Persistent Volume selector
## @param persistence.dataSource Custom PVC data source
## @param persistence.existingClaim Existing PVC to mount
##
persistence:
  enabled: true
  volumeName: data
  mountPath: /app/data
  subPath: ""
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}
  labels: {}
  selector: {}
  dataSource: {}
  existingClaim: ""

## @section Uptime Kuma workload parameters
## @param updateStrategy StatefulSet update strategy
## @param command Override the server container command
## @param args Override the server container arguments
## @param extraEnvVars Additional server environment variables
## @param extraEnvVarsCM Existing ConfigMap imported as environment variables
## @param extraEnvVarsSecret Existing Secret imported as environment variables
## @param extraVolumes Additional pod volumes
## @param extraVolumeMounts Additional server volume mounts
## @param initContainers Additional init containers
## @param sidecars Additional sidecar containers
##
updateStrategy:
  type: RollingUpdate
command: []
args: []
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []

## @section Uptime Kuma pod parameters
## @param podLabels Additional pod labels
## @param podAnnotations Additional pod annotations
## @param podSecurityContext.enabled Enable the pod security context
## @param podSecurityContext.fsGroupChangePolicy Pod filesystem group change policy
## @param podSecurityContext.sysctls Pod sysctls
## @param podSecurityContext.supplementalGroups Pod supplemental groups
## @param podSecurityContext.fsGroup Pod filesystem group
## @param containerSecurityContext.enabled Enable the container security context
## @param containerSecurityContext.runAsUser Container user ID
## @param containerSecurityContext.runAsGroup Container group ID
## @param containerSecurityContext.runAsNonRoot Require a non-root container
## @param containerSecurityContext.allowPrivilegeEscalation Allow privilege escalation
## @param containerSecurityContext.capabilities.drop Linux capabilities to drop
## @param containerSecurityContext.seccompProfile.type Seccomp profile type
##
podLabels: {}
podAnnotations: {}
# Preserve the official image's runtime defaults. Enable both contexts for
# non-root operation and ensure the data volume is writable by UID/GID 1000.
podSecurityContext:
  enabled: false
  fsGroupChangePolicy: Always
  sysctls: []
  supplementalGroups: []
  fsGroup: 1000
containerSecurityContext:
  enabled: false
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

## @section Uptime Kuma resource parameters
## @param resourcesPreset Common resource preset
## @param resources Explicit resource requests and limits
##
resourcesPreset: none
resources: {}

## @section Uptime Kuma probe parameters
## @param startupProbe.enabled Enable the startup probe
## @param startupProbe.httpGet.path Startup probe HTTP path
## @param startupProbe.httpGet.port Startup probe port name
## @param livenessProbe.enabled Enable the liveness probe
## @param livenessProbe.httpGet.path Liveness probe HTTP path
## @param livenessProbe.httpGet.port Liveness probe port name
## @param readinessProbe.enabled Enable the readiness probe
## @param readinessProbe.httpGet.path Readiness probe HTTP path
## @param readinessProbe.httpGet.port Readiness probe port name
## @param customStartupProbe Complete startup probe override
## @param customLivenessProbe Complete liveness probe override
## @param customReadinessProbe Complete readiness probe override
##
startupProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60
  successThreshold: 1
livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1
readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1
customStartupProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}

## @section Uptime Kuma scheduling parameters
## @param priorityClassName Pod priority class
## @param schedulerName Alternate scheduler
## @param terminationGracePeriodSeconds Pod termination grace period
## @param hostAliases Pod host aliases
## @param affinity Pod affinity rules
## @param nodeSelector Node selection labels
## @param tolerations Pod tolerations
## @param topologySpreadConstraints Pod topology spread constraints
##
priorityClassName: ""
schedulerName: ""
terminationGracePeriodSeconds: ""
hostAliases: []
affinity: {}
nodeSelector: {}
tolerations: []
topologySpreadConstraints: []

## @section Uptime Kuma ServiceAccount parameters
## @param serviceAccount.create Create the server ServiceAccount
## @param serviceAccount.name Server ServiceAccount name
## @param serviceAccount.automountServiceAccountToken Automount API credentials on the ServiceAccount
## @param serviceAccount.annotations Additional ServiceAccount annotations
## @param automountServiceAccountToken Automount API credentials in server pods
##
serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false
  annotations: {}
automountServiceAccountToken: false
