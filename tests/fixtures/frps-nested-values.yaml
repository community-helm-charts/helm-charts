auth:
  token: test-token
config:
  bindPort: 7000
  vhostHTTPPort: 8080
  vhostHTTPSPort: 8443
  transport:
    maxPoolCount: 5
    tls:
      force: true
  allowPorts:
    - start: 2000
      end: 3000
    - single: 3001
  httpPlugins:
    - name: user-manager
      addr: 127.0.0.1:9000
      path: /handler
      ops:
        - Login
